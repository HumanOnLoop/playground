# The "ci" check. The ruleset on main requires it (ruleset/main.json), and HOTL's CI/CD adapter waits for it on
# every run branch before it merges, and on main after every merge (ADR 0008).
name: ci

on:
  push:
    branches: [main, "run/**", "revert-*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would reformat:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
